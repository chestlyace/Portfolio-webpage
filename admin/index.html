<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Admin Portal - Chestly Ace</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@300;400;600;800&amp;display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#2563EB",
            "background-dark": "#0a0a0a",
            "card-dark": "#171717",
          },
          fontFamily: {
            display: ['"Bebas Neue"', "sans-serif"],
            body: ['"Inter"', "sans-serif"],
            sans: ['"Outfit"', "sans-serif"],
          },
        },
      },
    };
  </script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    body {
      background-color: #0a0a0a;
      color: white;
    }
  </style>
</head>

<body class="font-body antialiased">
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-6">
    <div class="glass p-8 rounded-2xl w-full max-w-md shadow-2xl">
      <h1 class="font-display text-4xl mb-6 text-center tracking-wider">ADMIN PORTAL</h1>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Access Password</label>
          <input type="password" id="admin-password"
            class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
            placeholder="••••••••" required>
        </div>
        <button type="submit"
          class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-gray-200 transition-colors uppercase tracking-widest text-sm">
          Login
        </button>
      </form>
    </div>
  </div>

  <div id="admin-dashboard" class="hidden min-h-screen pb-20">
    <nav class="glass sticky top-0 z-50 px-6 py-4 mb-8">
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-3">
          <span class="font-display text-2xl tracking-wider">DEV.ACE / ADMIN</span>
        </div>
        <button id="logout-btn" class="text-xs font-bold uppercase tracking-widest text-gray-400 hover:text-white">
          Logout
        </button>
      </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
        <!-- Sidebar Navigation -->
        <aside class="md:col-span-1 space-y-2">
          <button onclick="showTab('profile', event)"
            class="tab-btn w-full text-left px-4 py-3 rounded-xl glass hover:bg-white/10 transition-all font-medium text-sm flex items-center gap-3 active">
            <span class="material-icons-outlined text-lg">person</span> Profile
          </button>
          <button onclick="showTab('works', event)"
            class="tab-btn w-full text-left px-4 py-3 rounded-xl hover:bg-white/10 transition-all font-medium text-sm flex items-center gap-3">
            <span class="material-icons-outlined text-lg">work</span> Works
          </button>
          <button onclick="showTab('journey', event)"
            class="tab-btn w-full text-left px-4 py-3 rounded-xl hover:bg-white/10 transition-all font-medium text-sm flex items-center gap-3">
            <span class="material-icons-outlined text-lg">timeline</span> Journey
          </button>
          <button onclick="showTab('skills', event)"
            class="tab-btn w-full text-left px-4 py-3 rounded-xl hover:bg-white/10 transition-all font-medium text-sm flex items-center gap-3">
            <span class="material-icons-outlined text-lg">code</span> Skills
          </button>
        </aside>

        <!-- Main Content Area -->
        <section class="md:col-span-3">
          <!-- Profile Tab -->
          <div id="tab-profile" class="tab-content space-y-6">
            <div class="glass p-8 rounded-2xl">
              <h2 class="font-display text-3xl mb-6 tracking-wide">Hero & About Info</h2>
              <form id="profile-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Display Name</label>
                    <input type="text" name="display_name" class="admin-input">
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Hero Title 1</label>
                    <input type="text" name="title_1" class="admin-input">
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Hero Title 2</label>
                    <input type="text" name="title_2" class="admin-input">
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Hero Title 3</label>
                    <input type="text" name="title_3" class="admin-input">
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Tagline</label>
                  <input type="text" name="tagline" class="admin-input">
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">About Quote</label>
                  <input type="text" name="about_quote" class="admin-input">
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">About Text 1</label>
                  <textarea name="about_text_1" rows="4" class="admin-input"></textarea>
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">About Text 2</label>
                  <textarea name="about_text_2" rows="4" class="admin-input"></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Email</label>
                      <input type="email" name="email" class="admin-input">
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Phone</label>
                      <input type="text" name="phone" class="admin-input">
                    </div>
                </div>
                <div class="pt-4">
                  <button type="submit" class="save-btn">Save Changes</button>
                </div>
              </form>
            </div>

            <div class="glass p-8 rounded-2xl">
                <h2 class="font-display text-3xl mb-6 tracking-wide">Files & Media</h2>
                <div class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Hero Image</label>
                        <input type="file" id="hero-image-upload" class="hidden" onchange="uploadFile(this, 'hero_image')">
                        <label for="hero-image-upload" class="cursor-pointer glass px-6 py-3 rounded-xl inline-block hover:bg-white/10 transition-all text-sm font-bold">
                            Choose New Image
                        </label>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Resume PDF</label>
                        <input type="file" id="resume-upload" class="hidden" onchange="uploadFile(this, 'resume_url')">
                        <label for="resume-upload" class="cursor-pointer glass px-6 py-3 rounded-xl inline-block hover:bg-white/10 transition-all text-sm font-bold">
                            Upload New Resume
                        </label>
                    </div>
                </div>
            </div>
          </div>

          <!-- Works Tab -->
          <div id="tab-works" class="tab-content hidden space-y-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-display text-3xl tracking-wide">Projects, Designs & Events</h2>
                <button onclick="openWorkModal()" class="save-btn w-auto px-6">Add New Work</button>
            </div>
            <div id="works-list" class="grid grid-cols-1 gap-4">
                <!-- Works will be listed here -->
            </div>
          </div>

          <!-- Journey Tab -->
          <div id="tab-journey" class="tab-content hidden space-y-6">
             <div class="flex justify-between items-center mb-4">
                <h2 class="font-display text-3xl tracking-wide">Experience & Education</h2>
                <button onclick="openJourneyModal()" class="save-btn w-auto px-6">Add New Journey</button>
            </div>
            <div id="journey-list" class="space-y-4">
                <!-- Journey items will be listed here -->
            </div>
          </div>

          <!-- Skills Tab -->
          <div id="tab-skills" class="tab-content hidden space-y-6">
             <div class="flex justify-between items-center mb-4">
                <h2 class="font-display text-3xl tracking-wide">Manage Skills</h2>
                <form id="skill-form" class="flex gap-2">
                    <input type="text" id="skill-name" placeholder="Name" class="admin-input py-2">
                    <input type="text" id="skill-icon" placeholder="Icon (URL or Class)" class="admin-input py-2">
                    <select id="skill-category" class="admin-input py-2">
                        <option value="language">Language</option>
                        <option value="framework">Framework</option>
                        <option value="tool">Tool</option>
                    </select>
                    <button type="submit" class="save-btn w-auto px-6">Add</button>
                </form>
            </div>
            <div id="skills-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Skills will be listed here -->
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Work Modal -->
  <div id="work-modal" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-center justify-center p-6">
      <div class="glass p-8 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
          <h2 id="modal-title" class="font-display text-3xl mb-6">Add New Work</h2>
          <form id="work-form" class="space-y-4">
              <input type="hidden" name="id">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Type</label>
                      <select name="type" id="work-type-select" class="admin-input" onchange="toggleWorkFields()">
                          <option value="project">Project</option>
                          <option value="design">Design</option>
                          <option value="event">Event</option>
                      </select>
                  </div>
                  <div class="field-project field-event">
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Category Label</label>
                      <input type="text" name="category_label" placeholder="e.g. Mobile App" class="admin-input">
                  </div>
              </div>
              <div>
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Title</label>
                  <input type="text" name="title" class="admin-input" required>
              </div>
              <div class="field-project field-event">
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Description</label>
                  <textarea name="description" rows="3" class="admin-input"></textarea>
              </div>
              <div class="field-project field-event grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Live Link / Watch Recap</label>
                      <input type="text" name="live_url" class="admin-input">
                  </div>
                  <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">GitHub / Photo Album</label>
                      <input type="text" name="source_url" class="admin-input">
                  </div>
              </div>
              <div>
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Image / Preview</label>
                  <input type="file" name="image" class="admin-input bg-transparent border-dashed">
              </div>
              <div class="field-project">
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Tech Stack (Comma separated)</label>
                  <input type="text" name="tech_stack_input" placeholder="React, Tailwind, Node.js" class="admin-input">
              </div>
              <div class="field-event">
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Event Highlights (Comma separated)</label>
                  <input type="text" name="highlights_input" placeholder="Photography, Branding, Web" class="admin-input">
              </div>
              <div class="flex gap-3 pt-4">
                  <button type="submit" class="save-btn">Save Work</button>
                  <button type="button" onclick="closeModal('work-modal')" class="glass px-6 py-3 rounded-xl font-bold uppercase tracking-widest text-xs">Cancel</button>
              </div>
          </form>
      </div>
  </div>

  <!-- Journey Modal -->
  <div id="journey-modal" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-center justify-center p-6">
      <div class="glass p-8 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
          <h2 id="journey-modal-title" class="font-display text-3xl mb-6">Add New Journey</h2>
          <form id="journey-form" class="space-y-4">
              <input type="hidden" name="id">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Type</label>
                      <select name="type" class="admin-input">
                          <option value="work">Work Experience</option>
                          <option value="education">Education</option>
                      </select>
                  </div>
                  <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Dates</label>
                      <input type="text" name="dates" placeholder="e.g. 2023 - Present" class="admin-input" required>
                  </div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Role / Title</label>
                      <input type="text" name="role" class="admin-input" required>
                  </div>
                  <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Company / School</label>
                      <input type="text" name="company" class="admin-input" required>
                  </div>
              </div>
              <div>
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Description</label>
                  <textarea name="description" rows="3" class="admin-input"></textarea>
              </div>
              <div>
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Order Index</label>
                  <input type="number" name="order_index" class="admin-input" value="0">
              </div>
              <div class="flex gap-3 pt-4">
                  <button type="submit" class="save-btn">Save Journey</button>
                  <button type="button" onclick="closeModal('journey-modal')" class="glass px-6 py-3 rounded-xl font-bold uppercase tracking-widest text-xs">Cancel</button>
              </div>
          </form>
      </div>
  </div>

  <style>
    .admin-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      color: white;
      outline: none;
      transition: all 0.2s;
    }

    .admin-input:focus {
      border-color: #2563EB;
      background: rgba(255, 255, 255, 0.08);
    }

    .save-btn {
      width: 100%;
      background: white;
      color: black;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 1rem;
      border-radius: 0.75rem;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .save-btn:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.1);
      border-color: #2563EB;
    }
  </style>

  <script src="admin.js"></script>
</body>

</html>
